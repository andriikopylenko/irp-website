<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>5.07 Doświadczenie Zawodowe</title>
<style>
:root{--blue:#cddfec;--green:#d8ebc4;--border:#111;--light:#cddfec}
*{box-sizing:border-box}body{margin:0;background:var(--blue);font-family:Verdana,Geneva,sans-serif;color:#111}.page{max-width:1100px;margin:0 auto;min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--blue)}.top{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.top h1{margin:0;font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{font:700 14px Verdana,Geneva,sans-serif;color:#111;text-decoration:none;border:1px solid var(--border);background:var(--green);padding:9px 12px;cursor:pointer}.lang{background:var(--light)}main{padding:28px 22px}.box{border:1px solid var(--border);padding:20px;background:var(--blue)}.box h2{margin:0 0 14px;font-size:20px}.box p{margin:0 0 12px;font-size:15px;line-height:1.45}.pdf-link{display:inline-block;margin-top:8px}@media(max-width:700px){.top h1{font-size:20px}main{padding:14px 12px}}

    html { min-width: 980px; }
  

/* Responsive compatibility for older/smaller laptop screens */
html, body { min-width: 0 !important; }
body { overflow-x: hidden; }
.shell, .page { width: min(1450px, 100%) !important; min-width: 0 !important; max-width: 1450px; margin-left: auto; margin-right: auto; }
img { max-width: 100%; height: auto; }
@media (max-width: 1300px) {
  .shell, .page { width: 100% !important; }
  body { font-size: 16px; line-height: 1.35; }
  main, .content, .section, .toc-wrap { max-width: 100%; }
}
@media (max-width: 1080px) {
  .top { flex-wrap: wrap; gap: 8px; }
  .top h1, .top-title h1 { font-size: 21px !important; }
  .toc { grid-template-columns: 1fr !important; }
}

</style>
</head>
<body><div class="page"><header class="top"><h1 data-en="5.07 Professional Experience" data-pl="5.07 Doświadczenie Zawodowe">5.07 Doświadczenie Zawodowe</h1><div class="actions"><a data-en="Back to Representative" data-pl="Powrót do Przedstawiciela" href="index.html#przedstawiciel" id="back">Powrót do Przedstawiciela</a><button class="lang" data-set-lang="pl">PL</button><button class="lang" data-set-lang="en">EN</button></div></header><main><section class="box"><h2 data-en="Temporary material" data-pl="Materiał tymczasowy">Materiał tymczasowy</h2><p data-en="The original PDF has already been added. Once the Word file is received, the content will be transferred to the page as regular text on the blue background, with images and documents presented separately." data-pl="Oryginalny materiał PDF został już dodany. Po otrzymaniu pliku Word treść zostanie przeniesiona na stronę jako zwykły tekst na błękitnym tle, a zdjęcia i dokumenty zostaną umieszczone osobno.">Oryginalny materiał PDF został już dodany. Po otrzymaniu pliku Word treść zostanie przeniesiona na stronę jako zwykły tekst na błękitnym tle, a zdjęcia i dokumenty zostaną umieszczone osobno.</p><a class="pdf-link" data-en="Open PDF" data-pl="Otwórz PDF" href="5.07-Doswiadczenie-Zawodowe.pdf" rel="noopener" target="_blank">Otwórz PDF</a></section></main></div>
<script>(function(){const q=new URLSearchParams(location.search);let lang=q.get('lang')||localStorage.getItem('irp-lang')||'pl';if(!['pl','en'].includes(lang))lang='pl';function apply(l){lang=l;localStorage.setItem('irp-lang',l);document.documentElement.lang=l;document.querySelectorAll('[data-pl][data-en]').forEach(el=>el.innerHTML=el.dataset[l]);document.getElementById('back').href='index.html?lang='+l+'#przedstawiciel';document.querySelectorAll('[data-set-lang]').forEach(b=>b.style.background=b.dataset.setLang===l?'var(--green)':'var(--light)');history.replaceState(null,'',location.pathname+'?lang='+l)}document.querySelectorAll('[data-set-lang]').forEach(b=>b.addEventListener('click',()=>apply(b.dataset.setLang)));apply(lang)})();</script>
</body></html>
