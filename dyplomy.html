<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5.02 Dyplomy</title>
<style>
:root{--blue:#cddfec;--green:#d8ebc4;--border:#111;--light:#e8f0f6;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--blue);font-family:Verdana,Geneva,sans-serif;color:#111}
.page{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--blue);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.top{position:sticky;top:0;z-index:10;background:var(--blue);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:24px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
a,button.ctrl{font:700 14px Verdana,Geneva,sans-serif;color:#111;text-decoration:none;border:1px solid var(--border);background:var(--green);padding:9px 12px;cursor:pointer}
.lang{background:#e8f0f6}
.section{padding:20px 22px 0}
.box{border:1px solid var(--border);padding:16px 18px;background:var(--blue)}
.box h2{margin:0 0 12px;font-size:18px}
.box p{margin:0 0 10px;font-size:15px;line-height:1.35}
.box p:last-child{margin-bottom:0}
.box ol{margin:0;padding-left:24px}
.box li{font-size:15px;line-height:1.45;margin:0 0 10px}
.gallery{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;align-items:start}
.media-card{background:var(--blue);border:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px}
.media-title{font-size:15px;font-weight:700;line-height:1.3}
.doc-thumb{display:block;width:100%;border:0;background:transparent;padding:0;cursor:zoom-in}
.doc-thumb img{display:block;width:100%;height:auto;background:white;border:1px solid #879baa;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.overlay[hidden]{display:none}
.overlay-box{position:relative;max-width:min(96vw,1200px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.overlay-box img{max-width:100%;max-height:80vh;width:auto;height:auto;background:white;border:1px solid #999;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.overlay-box .caption{color:#fff;font-size:14px;text-align:center}
.close-btn{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:50%;border:1px solid #333;background:#fff;color:#111;font:700 20px/1 Arial,sans-serif;cursor:pointer}
.note{font-size:14px;opacity:.9}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.top h1{font-size:20px}.section{padding:12px 12px 0}.gallery{padding:12px;grid-template-columns:1fr}}

    html { min-width: 980px; }
  </style>
</head>
<body>
<div class="page">
<header class="top">
<h1 data-pl="5.02 Dyplomy" data-en="5.02 Diplomas">5.02 Dyplomy</h1>
<div class="actions">
<a id="back" href="index.html#przedstawiciel" data-pl="Powrót do Przedstawiciela" data-en="Back to Representative">Powrót do Przedstawiciela</a>
<button class="ctrl lang" type="button" data-set-lang="pl">PL</button>
<button class="ctrl lang" type="button" data-set-lang="en">EN</button>
</div>
</header>
<section class="section"><div class="box">
<h2 data-pl="Galeria dyplomów" data-en="Diploma gallery">Galeria dyplomów</h2>
<p data-pl="Poniżej przedstawiono dyplomy jako osobne obrazy na błękitnym tle strony." data-en="Below, the diplomas are presented as separate images on the blue page background.">Poniżej przedstawiono dyplomy jako osobne obrazy na błękitnym tle strony.</p>
<p class="note" data-pl="Kliknij obraz, aby go powiększyć." data-en="Click an image to enlarge it.">Kliknij obraz, aby go powiększyć.</p>
</div></section>
<main class="gallery"><article class="media-card"><div class="media-title" data-pl="Dyplom 1" data-en="Diploma 1">Dyplom 1</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-1.jpg" data-caption="5.02 Dyplomy — pozycja 1"><img src="assets/dyplomy/docx-gallery/dyplom-1.jpg" alt="5.02 Dyplomy — pozycja 1"></button></article>
<article class="media-card"><div class="media-title" data-pl="Dyplom 2" data-en="Diploma 2">Dyplom 2</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-2.jpg" data-caption="5.02 Dyplomy — pozycja 2"><img src="assets/dyplomy/docx-gallery/dyplom-2.jpg" alt="5.02 Dyplomy — pozycja 2"></button></article>
<article class="media-card"><div class="media-title" data-pl="Dyplom 3" data-en="Diploma 3">Dyplom 3</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-3.jpg" data-caption="5.02 Dyplomy — pozycja 3"><img src="assets/dyplomy/docx-gallery/dyplom-3.jpg" alt="5.02 Dyplomy — pozycja 3"></button></article>
<article class="media-card"><div class="media-title" data-pl="Dyplom 4" data-en="Diploma 4">Dyplom 4</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-4.jpg" data-caption="5.02 Dyplomy — pozycja 4"><img src="assets/dyplomy/docx-gallery/dyplom-4.jpg" alt="5.02 Dyplomy — pozycja 4"></button></article>
<article class="media-card"><div class="media-title" data-pl="Dyplom 5" data-en="Diploma 5">Dyplom 5</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-5.jpg" data-caption="5.02 Dyplomy — pozycja 5"><img src="assets/dyplomy/docx-gallery/dyplom-5.jpg" alt="5.02 Dyplomy — pozycja 5"></button></article>
<article class="media-card"><div class="media-title" data-pl="Dyplom 6" data-en="Diploma 6">Dyplom 6</div><button class="doc-thumb" type="button" data-full="assets/dyplomy/docx-gallery/dyplom-6.jpg" data-caption="5.02 Dyplomy — pozycja 6"><img src="assets/dyplomy/docx-gallery/dyplom-6.jpg" alt="5.02 Dyplomy — pozycja 6"></button></article></main>
</div>
<div class="overlay" id="overlay" hidden><div class="overlay-box"><button id="close-overlay" class="close-btn" type="button" aria-label="Close">×</button><img id="overlay-img" src="" alt=""><div class="caption" id="overlay-cap"></div></div></div>

<script>
(function(){
 const params=new URLSearchParams(location.search);
 let lang=params.get('lang')||localStorage.getItem('irp-lang')||'pl';
 if(!['pl','en'].includes(lang)) lang='pl';
 function apply(l){
   lang=l; localStorage.setItem('irp-lang',l); document.documentElement.lang=l;
   document.querySelectorAll('[data-pl][data-en]').forEach(el=>{el.innerHTML=el.dataset[l];});
   const b=document.getElementById('back'); if (b) b.href='index.html?lang='+l+'#przedstawiciel';
   document.querySelectorAll('[data-set-lang]').forEach(btn=>btn.style.background=btn.dataset.setLang===l?'var(--green)':'var(--light)');
   history.replaceState(null,'',location.pathname+'?lang='+l);
 }
 document.querySelectorAll('[data-set-lang]').forEach(btn=>btn.addEventListener('click',()=>apply(btn.dataset.setLang)));
 apply(lang);
 const overlay=document.getElementById('overlay');
 if(overlay){
   const overlayImg=document.getElementById('overlay-img');
   const overlayCap=document.getElementById('overlay-cap');
   function closeOverlay(){ overlay.hidden=true; overlayImg.src=''; }
   document.querySelectorAll('.doc-thumb').forEach(btn=>btn.addEventListener('click',()=>{
     overlayImg.src=btn.dataset.full;
     overlayCap.textContent=btn.dataset.caption||'';
     overlay.hidden=false;
   }));
   document.getElementById('close-overlay').addEventListener('click',closeOverlay);
   overlay.addEventListener('click',e=>{ if(e.target===overlay) closeOverlay(); });
   document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });
 }
})();
</script>

</body></html>
