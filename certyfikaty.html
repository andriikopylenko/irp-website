<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>5.01 Certyfikaty</title>
<style>
:root{--blue:#cddfec;--green:#dcefc7;--border:#111;--panel:#d8e8f3;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--blue);font-family:Verdana,Geneva,sans-serif;color:#111}
.page{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--blue);border-left:1px solid var(--border);border-right:1px solid var(--border)}
.top{position:sticky;top:0;z-index:10;background:var(--blue);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:24px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
a,button.ctrl{font:700 14px Verdana,Geneva,sans-serif;color:#111;text-decoration:none;border:1px solid var(--border);background:var(--green);padding:9px 12px;cursor:pointer}
.lang{background:#e8f0f6}
.intro{padding:20px 22px 0}
.intro-box{border:1px solid var(--border);padding:14px 16px;background:rgba(255,255,255,.16)}
.intro-box p{margin:0;font-size:15px;line-height:1.35}
.gallery{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;align-items:start}
.doc-thumb{display:block;width:100%;border:0;background:transparent;padding:0;cursor:zoom-in}
.doc-thumb img{display:block;width:100%;height:auto;background:white;border:1px solid #879baa;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.overlay[hidden]{display:none}
.overlay-box{position:relative;max-width:min(96vw,1200px);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:10px}
.overlay-box img{max-width:100%;max-height:80vh;width:auto;height:auto;background:white;border:1px solid #999;box-shadow:0 10px 35px rgba(0,0,0,.35)}
.overlay-box .caption{color:#fff;font-size:14px;text-align:center}
.close-btn{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:50%;border:1px solid #333;background:#fff;color:#111;font:700 20px/1 Arial,sans-serif;cursor:pointer}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.top h1{font-size:20px}.intro{padding:12px 12px 0}.gallery{padding:12px;grid-template-columns:1fr}}

    html { min-width: 980px; }
  

/* Responsive compatibility for older/smaller laptop screens */
html, body { min-width: 0 !important; }
body { overflow-x: hidden; }
.shell, .page { width: min(1450px, 100%) !important; min-width: 0 !important; max-width: 1450px; margin-left: auto; margin-right: auto; }
img { max-width: 100%; height: auto; }
@media (max-width: 1300px) {
  .shell, .page { width: 100% !important; }
  body { font-size: 16px; line-height: 1.35; }
  main, .content, .section, .toc-wrap { max-width: 100%; }
}
@media (max-width: 1080px) {
  .top { flex-wrap: wrap; gap: 8px; }
  .top h1, .top-title h1 { font-size: 21px !important; }
  .toc { grid-template-columns: 1fr !important; }
}

</style>
</head>
<body>
<div class="page">
<header class="top">
<h1 data-en="5.01 Certificates" data-pl="5.01 Certyfikaty">5.01 Certyfikaty</h1>
<div class="actions">
<a data-en="Back to Representative" data-pl="Powrót do Przedstawiciela" href="index.html#przedstawiciel" id="back">Powrót do Przedstawiciela</a>
<button class="ctrl lang" data-set-lang="pl" type="button">PL</button>
<button class="ctrl lang" data-set-lang="en" type="button">EN</button>
</div>
</header>
<section class="intro"><div class="intro-box"><p data-en="Click a document to enlarge it." data-pl="Kliknij dokument, aby go powiększyć.">Kliknij dokument, aby go powiększyć.</p></div></section>
<main class="gallery"><button class="doc-thumb" data-caption="5.01 Certyfikaty — pozycja 1" data-full="certyfikat-1.png" type="button">
<img alt="5.01 Certyfikaty — pozycja 1" src="certyfikat-1.png"/>
</button>
<button class="doc-thumb" data-caption="5.01 Certyfikaty — pozycja 2" data-full="certyfikat-2.png" type="button">
<img alt="5.01 Certyfikaty — pozycja 2" src="certyfikat-2.png"/>
</button>
<button class="doc-thumb" data-caption="5.01 Certyfikaty — pozycja 3" data-full="certyfikat-3.png" type="button">
<img alt="5.01 Certyfikaty — pozycja 3" src="certyfikat-3.png"/>
</button>
<button class="doc-thumb" data-caption="5.01 Certyfikaty — pozycja 4" data-full="certyfikat-4.png" type="button">
<img alt="5.01 Certyfikaty — pozycja 4" src="certyfikat-4.png"/>
</button></main>
</div>
<div class="overlay" hidden="" id="overlay">
<div class="overlay-box">
<button aria-label="Close" class="close-btn" id="close-overlay" type="button">×</button>
<img alt="" id="overlay-img" src=""/>
<div class="caption" id="overlay-cap"></div>
</div>
</div>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 let lang=params.get('lang')||localStorage.getItem('irp-lang')||'pl';
 if(!['pl','en'].includes(lang)) lang='pl';
 function apply(l){
   lang=l; localStorage.setItem('irp-lang',l); document.documentElement.lang=l;
   document.querySelectorAll('[data-pl][data-en]').forEach(el=>{el.innerHTML=el.dataset[l];});
   const b=document.getElementById('back'); b.href='index.html?lang='+l+'#przedstawiciel';
   document.querySelectorAll('[data-set-lang]').forEach(btn=>btn.style.background=btn.dataset.setLang===l?'var(--green)':'#e8f0f6');
   history.replaceState(null,'',location.pathname+'?lang='+l);
 }
 document.querySelectorAll('[data-set-lang]').forEach(btn=>btn.addEventListener('click',()=>apply(btn.dataset.setLang)));
 apply(lang);
 const overlay=document.getElementById('overlay');
 const overlayImg=document.getElementById('overlay-img');
 const overlayCap=document.getElementById('overlay-cap');
 function closeOverlay(){ overlay.hidden=true; overlayImg.src=''; }
 document.querySelectorAll('.doc-thumb').forEach(btn=>btn.addEventListener('click',()=>{
   overlayImg.src=btn.dataset.full;
   overlayCap.textContent=btn.dataset.caption||'';
   overlay.hidden=false;
 }));
 document.getElementById('close-overlay').addEventListener('click',closeOverlay);
 overlay.addEventListener('click',e=>{ if(e.target===overlay) closeOverlay(); });
 document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });
})();
</script>
</body></html>
